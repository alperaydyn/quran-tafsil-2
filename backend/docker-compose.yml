# tafsil.net — Backend Docker Compose
# Veritabanı ve altyapı servisleri
# Kullanım: docker compose up -d

services:
  # ─── PostgreSQL 16 + pgvector ───────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tafsil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tafsil_db}
      POSTGRES_USER: ${POSTGRES_USER:-tafsil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tafsil} -d ${POSTGRES_DB:-tafsil_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

  # ─── Redis 7 (L1/L2 Cache + BullMQ) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tafsil-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M

  # ─── PgBouncer (Connection Pooling) ────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    container_name: tafsil-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tafsil}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tafsil_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      SERVER_RESET_QUERY: DISCARD ALL
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: tafsil-prod
